name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-qa:
    name: Frontend QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: potyk-io-front
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: potyk-io-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: vue-tsc
        run: npm run typecheck

      - name: Biome
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: potyk-io-front
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: potyk-io-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: potyk-io-front/package-lock.json

      - name: Install dependencies
        working-directory: potyk-io-front
        run: npm ci

      - name: Build
        working-directory: potyk-io-front
        run: npm run build

      - name: Pack dist
        run: tar -C potyk-io-front -czf potyk-io-front-dist.tar.gz dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: potyk-io-front-dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: [frontend-qa, frontend-tests, build]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: potyk-io-front-dist.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/potyk-io
            git pull
            source ./.venv/bin/activate
            pip install -r requirements.txt
            python -m alembic upgrade head
            rm -rf potyk-io-front/dist
            mkdir -p potyk-io-front
            tar -C potyk-io-front -xzf /tmp/potyk-io-front-dist.tar.gz
            rm -f /tmp/potyk-io-front-dist.tar.gz
            sudo cp ./ops/potyk-io.service /etc/systemd/system/potyk-io.service
            sudo cp ./ops/potyk-io-backup.service /etc/systemd/system/potyk-io-backup.service
            sudo cp ./ops/potyk-io-backup.timer /etc/systemd/system/potyk-io-backup.timer
            sudo cp ./ops/potyk-tg.service /etc/systemd/system/potyk-tg.service
            sudo ln -sf /home/leybovich-nikita/potyk-io/ops/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl daemon-reload
            sudo systemctl restart potyk-io.service
            sudo systemctl enable --now potyk-io-backup.timer
            sudo systemctl restart potyk-tg.service
            sudo systemctl reload caddy
