{% extends "_base.html" %}

{% block style %}
    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        main {
            margin: auto;
            max-width: 640px;
            padding: 48px 16px;
        }

        .notes {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            box-shadow: 0 1px 2px rgba(120, 70, 30, 0.06),
                0 4px 12px rgba(120, 70, 30, 0.08),
                0 12px 28px rgba(120, 70, 30, 0.07);
            background: white;
            border-radius: 16px;
            padding: 20px;
        }

        .note-preview {
            line-height: 1.5;
        }

        .note-preview > :first-child {
            margin-top: 0;
        }

        .note-preview > :last-child {
            margin-bottom: 0;
        }

        .hint {
            margin-top: 12px;
            margin-bottom: 0;
            color: #9f9f9f;
            font-size: 0.75rem;
        }

        .hint a {
            color: inherit;
        }

        .footer-hint {
            margin-top: 24px;
            color: #9f9f9f;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
{% endblock %}

{% block main %}
    {% if random_notes %}
        <div class="notes">
            {% for note in random_notes %}
                <div class="card">
                    <div class="note-preview">{{ note.preview | safe }}</div>
                    <p class="hint"><a href="{{ note.url }}">{{ note.name }}</a></p>
                </div>
            {% endfor %}
        </div>
        <p class="footer-hint">обнови страницу · ещё три</p>
    {% else %}
        <p class="footer-hint">заметок пока нет</p>
    {% endif %}
{% endblock %}
