{% extends "_base.html" %}

{% block style %}
    <link rel="stylesheet" href="/static/css/index.css">
{% endblock %}

{% block main %}

    <h1>potyk.io</h1>

    <div class="notes">
        {% for note in random_notes %}
            <div class="card">
                <div class="note-preview">{{ note.preview | safe }}</div>
                <p class="hint"><a href="{{ note.url }}">{{ note.name }}</a></p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
