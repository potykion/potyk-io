{% extends "_base.html" %}

{% block style %}
    <style>
        body {
            font-family: "IBM Plex Sans", system-ui;
            margin: 0;
            background: #f8f2ec;
            min-height: 100vh;
        }

        main {
            margin-left: auto;
            margin-right: auto;
            max-width: 900px;
            padding: 16px;
        }

        .card {
            box-shadow: 0 1px 2px rgba(120, 70, 30, 0.06),
            0 4px 12px rgba(120, 70, 30, 0.08),
            0 12px 28px rgba(120, 70, 30, 0.07);
            background: white;
            border-radius: 16px;
            padding: 8px;
            grid-column: span 2;
            grid-row: span 2;
        }

        .icon {
            box-shadow: 0 1px 2px rgba(120, 70, 30, 0.06),
            0 4px 12px rgba(120, 70, 30, 0.08),
            0 12px 28px rgba(120, 70, 30, 0.07);
            background: white;
            border-radius: 16px;
            padding: 8px;

        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media screen and (max-width: 480px) {
            body {
                font-size: 0.9rem;
            }


            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }


        h1 {
            font-size: 3rem;
            margin-top: 24px;
            margin-bottom: 0px;
            text-align: center
        }

        h2 {
            margin-top: 8px;
            margin-bottom: 8px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding-bottom: 8px;
        }

        #globe {
            width: 24px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .flex-col {
            flex-direction: column;
        }

    </style>
{% endblock %}

{% block main %}
    <div style="; margin-bottom: 24px;">
        <h1>potyk.io</h1>
        <div class="flex-center" style=" color: #9f9f9f; ">
            <span style="border-bottom: 1px dotted gray; cursor: zoom-in"
                  title="Занимаюсь хуйнёй">Делаю свой интернет</span> <img src="../static/img/globe.gif" id="globe">
        </div>

    <div class="grid" id="cards"></div>
{% endblock %}
