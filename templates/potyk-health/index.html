{% extends "potyk-io/_base.html" %}

{% block title %}potyk-health{% endblock %}

{% block style %}
{{ super() }}
<link rel="stylesheet" href="/static/potyk-io/css/index.css">
<link rel="stylesheet" href="/static/potyk-io/css/index_v2.css">
<link rel="stylesheet" href="/static/potyk-io/css/md-content.css">
<link rel="stylesheet" href="/static/potyk-io/css/meditation.css">
<link rel="stylesheet" href="/static/jinja/css/forms.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css">
<link rel="stylesheet" href="/static/potyk-io/css/stata.css">
{% endblock %}

{% block main %}
<h1>potyk-health</h1>
<div class="flex-center" style="color: #9f9f9f; margin-bottom: 24px;">
    <span>здоровье</span>
</div>

<div class="flex-center health-home-widgets">
    <div class="card index-v2-widget index-v2-widget--meditation">
        <div class="flex-center">
            <a class="index-v2-widget__title-link" href="/health/meditation">
                <h3 class="index-v2-widget__title">Медитировал?</h3>
            </a>
        </div>
        <div class="flex-center">
            <button type="button" class="meditation-check meditation-check--widget" aria-label="Отметить медитацию">✓</button>
        </div>
    </div>
    {% include "potyk-health/_stata_widget.html" %}
</div>
{% endblock %}

{% block script %}
{{ super() }}
<script src="/static/potyk-io/js/meditation.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
<script src="/static/potyk-io/js/stata.js"></script>
{% endblock %}
