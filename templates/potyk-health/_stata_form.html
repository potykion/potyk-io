<form class="stata-form{% if stata_form_widget %} stata-form--widget{% endif %}"
      data-stata-form
      data-stata-endpoint="{{ stata_endpoint|default('/health/stata') }}"
      data-stata-empty-error="{{ stata_empty_error|default('выбери дело') }}">
    <label>
        {{ stata_form_label|default('Дела') }}
        <select name="items"
                data-tom-select
                data-create="true"
                data-max-items="1"
                data-placeholder="выбери или добавь">
            {% for item in stata_items %}
            <option value="{{ item.name }}">{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>
    <p class="stata-form__error" data-stata-error hidden></p>
    <div class="stata-form__actions">
        <button type="submit"{% if stata_form_widget %} class="btn-s"{% endif %}>{{ stata_submit_label|default('Отметить') }}</button>
    </div>
</form>
