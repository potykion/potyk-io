<form class="stata-form"
      data-stata-form
      data-stata-endpoint="{{ stata_endpoint|default('/health/stata') }}"
      data-stata-empty-error="{{ stata_empty_error|default('выбери хотя бы одно дело') }}">
    <label>
        {{ stata_form_label|default('Дела') }}
        <select name="items"
                multiple
                data-tom-select
                data-create="true"
                data-placeholder="выбери или добавь">
            {% for item in stata_items %}
            <option value="{{ item.name }}">{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>
    <p class="stata-form__error" data-stata-error hidden></p>
    <div class="stata-form__actions">
        <button type="submit">{{ stata_submit_label|default('Отметить') }}</button>
    </div>
</form>
