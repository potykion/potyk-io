<script src="/static/jinja/js/side-panel.js"></script>
<script>
    (function () {
        var STORAGE_KEY = 'menu-open';
        var body = document.body;
        var toggle = document.getElementById('menu-toggle');
        var sidebar = document.getElementById('sidebar');
        var mq = window.matchMedia('(max-width: 767px)');
        var SidePanel = window.PotykSidePanel;

        function isMobile() {
            return mq.matches;
        }

        function defaultVisible() {
            return false;
        }

        function readStored() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw === 'true') return true;
                if (raw === 'false') return false;
            } catch (e) {}
            return null;
        }

        function writeStored(open) {
            try {
                localStorage.setItem(STORAGE_KEY, open ? 'true' : 'false');
            } catch (e) {}
        }

        function isVisible() {
            if (isMobile()) {
                return SidePanel ? SidePanel.isOpen('sidebar') : false;
            }
            return !body.classList.contains('menu-collapsed');
        }

        function syncAria() {
            var visible = isVisible();
            if (toggle) toggle.setAttribute('aria-expanded', visible ? 'true' : 'false');
            if (sidebar && !isMobile()) {
                sidebar.setAttribute('aria-hidden', visible ? 'false' : 'true');
            }
        }

        function setVisible(open, persist) {
            if (isMobile()) {
                body.classList.remove('menu-collapsed');
                if (SidePanel) {
                    if (open) SidePanel.open('sidebar');
                    else SidePanel.close('sidebar');
                }
            } else {
                if (SidePanel) SidePanel.close('sidebar');
                body.classList.toggle('menu-collapsed', !open);
            }
            if (persist !== false) writeStored(open);
            syncAria();
        }

        function toggleMenu() {
            setVisible(!isVisible());
        }

        function closeMenu() {
            setVisible(false);
        }

        function applyStoredOrDefault() {
            var stored = readStored();
            setVisible(stored === null ? defaultVisible() : stored, false);
        }

        if (toggle) toggle.addEventListener('click', toggleMenu);

        if (sidebar) {
            sidebar.addEventListener('click', function (e) {
                if (!isMobile()) return;
                if (e.target.closest('a.sidebar-link')) closeMenu();
            });
            sidebar.addEventListener('sidepanel:close', syncAria);
            sidebar.addEventListener('sidepanel:open', syncAria);
        }

        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            if (isMobile()) return;
            if (SidePanel && SidePanel.anyOpen()) return;
            closeMenu();
        });

        mq.addEventListener('change', applyStoredOrDefault);

        applyStoredOrDefault();
    })();
</script>
