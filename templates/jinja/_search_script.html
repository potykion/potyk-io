<script>
    (function () {
        var body = document.body;
        var searchShell = document.getElementById('search-shell');
        var searchToggle = document.getElementById('search-toggle');
        var searchBack = document.getElementById('search-back');
        var searchInput = document.getElementById('search-input');
        var searchBar = document.getElementById('search-bar');
        var mq = window.matchMedia('(max-width: 767px)');

        function isMobile() {
            return mq.matches;
        }

        function isSearchOpen() {
            return body.classList.contains('search-open');
        }

        function setSearchOpen(open) {
            body.classList.toggle('search-open', open);
            if (searchToggle) {
                searchToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            if (open && searchInput) {
                requestAnimationFrame(function () {
                    searchInput.focus();
                    searchInput.select();
                });
            }
        }

        if (searchToggle) {
            searchToggle.addEventListener('click', function () {
                setSearchOpen(!isSearchOpen());
            });
        }

        if (searchBack) {
            searchBack.addEventListener('click', function () {
                setSearchOpen(false);
            });
        }

        if (searchBar) {
            searchBar.addEventListener('submit', function () {
                setSearchOpen(false);
            });
        }

        document.addEventListener('pointerdown', function (e) {
            if (!isSearchOpen() || isMobile()) return;
            if (searchShell && !searchShell.contains(e.target)) {
                setSearchOpen(false);
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && isSearchOpen()) {
                setSearchOpen(false);
            }
        });
    })();
</script>
