{% for note in notes %}
    <a class="card{% if note.kind == 'link' %} card-link{% endif %}{% if note.cover %} content-card{% else %} card-text{% endif %}{% if note.cover and (card_ratio == '4/3' or note.ratio == '4/3') %} card-ratio-4-3{% elif note.cover and (card_ratio == '9/16' or note.ratio == '9/16') %} card-ratio-9-16{% endif %}"
       href="{{ note.url }}"
       {% if note.external %}target="_blank" rel="noopener"{% endif %}>
        {% if note.cover %}
            {% if note.cover_video %}
                <video class="note-cover" src="{{ note.cover }}" muted autoplay loop playsinline preload="metadata"></video>
            {% else %}
                <img class="note-cover" src="{{ note.cover }}" alt="" loading="lazy">
            {% endif %}
        {% endif %}
        <div class="note-preview md-content">{{ note.preview | safe }}</div>
    </a>
{% endfor %}
{% if has_more and more_url %}
    <div class="card-grid-more"
         hx-get="{{ more_url }}{% if '?' in more_url %}&{% else %}?{% endif %}exclude={{ exclude|join(',')|urlencode }}"
         hx-trigger="revealed"
         hx-swap="outerHTML"></div>
{% endif %}
