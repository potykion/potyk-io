{% for note in notes %}
    <a class="card" href="{{ note.url }}">
        <div class="note-preview">{{ note.preview | safe }}</div>
    </a>
{% endfor %}
{% if has_more %}
    <div class="notes-more"
         hx-get="/feed/more?exclude={{ exclude|join(',')|urlencode }}"
         hx-trigger="revealed"
         hx-swap="outerHTML"></div>
{% endif %}
