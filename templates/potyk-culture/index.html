{% extends "potyk-io/_base.html" %}

{% block title %}potyk-culture{% endblock %}

{% block style %}
{{ super() }}
<link rel="stylesheet" href="/static/potyk-io/css/index.css">
{% endblock %}

{% block main %}
<h1>potyk-culture</h1>

<div class="card-grid">
    {% for page in pages %}
        <a class="card card-text" href="{{ page.url }}">
            <h3>{{ page.title }}</h3>
        </a>
    {% else %}
        <p class="card-grid-empty">Пока пусто</p>
    {% endfor %}
</div>
{% endblock %}
