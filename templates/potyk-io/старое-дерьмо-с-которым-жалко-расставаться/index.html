<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>potyk.io</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
          rel="stylesheet">

    <style>
        body {
    font-family: Rubik, system-ui;
    font-size: 0.8rem;
}

footer {
    margin-bottom:  10px ;
}

body {
    margin: auto;
    padding: 4px;
    max-width: 500px;
}

@media screen and (max-width: 480px) {
    .main {
        margin-top: 0;
    }
}

.title {
    font-size: 48px;
    border-radius: 20px;
    margin-bottom: 0;
    text-align: center;
}

.subtitle {
    margin-top: 0;
    margin-bottom: 12px;

    color: dodgerblue;


}

.center {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

a {
    color: dodgerblue;
    padding: 2px;
    border-radius: 2px;
    font-weight: bold;

}

a:hover {
    background: lemonchiffon;

}

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px


}

.mb-6 {
    margin-bottom: 6px;
}

.chip {
    /*font-weight: bold;*/
}

.projects {
    display: flex;
    flex-direction: column;
    gap: 5px
}

.proj {
    text-decoration: none;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #e8e8e8
}

.proj:hover {
    background: yellow;
}

.proj-title {
    font-weight: bold;
    text-decoration: underline;
}

.proj-subtitle {
    color: black;
    font-style: italic;
}

summary {
    text-align: center;
    margin-bottom: 10px;
}

h2 {
    margin-bottom: 0px;
    margin-top: 0px;
}

hr {
    border: 1px solid #f4f4f4;
    margin: 10px;
}

#globe {
    width: 24px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    margin-bottom: 16px;
}

.card {
    padding: 8px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: inherit;
    font-weight: 600;
    flex-grow: 1;
    border: 1px solid dodgerblue;
}

.card-header {

    padding: 0;
    border: 0;
    align-items: baseline;
}

.card-subtitle {
    font-weight: normal;
}

.card:hover {
    background: lemonchiffon;
}

.card-header:hover {
    background: inherit;
}

.card-marked {
    background: lightyellow;
}

.card-marked:hover {
    background: lemonchiffon;
}

    </style>

</head>
<body>
<main class="main">
    <h1 class="title">potyk.io</h1>
    <div class="subtitle center">Делаю свой интернет <img src="/static/potyk-io/img/globe.gif" id="globe"></div>

    <!-- Контент-Проекты -->
    <div class="card card-header">
        <h2> <small>📝</small> Контент</h2>•
        <div class="subtitle card-subtitle">Пишу, пощу, все удалить хочу</div>
    </div>
    <div class="chips" id="projects"></div>

    <!-- Таблички -->
    <div class="card card-header">
        <h2> <small>📊</small> Таблички</h2>•
        <div class="subtitle card-subtitle">Бич, я молодой PLUSHкин</div>
    </div>
    <div class="chips" id="tables"></div>

    <!-- Кодинг-Проекты -->
    <div class="card card-header">
        <h2> <small>🤖</small> Прога</h2>•
        <div class="subtitle card-subtitle">Coding shit × smoking weed</div>
    </div>
    <div class="chips" id="coding-projects"></div>



</main>

<footer style="text-align: center;">
    <a href="https://github.com/potykion/potykion.github.io">Гитхаб</a>
</footer>

</body>
<script>
    /**
     * @typedef {Object} Project
     * @property {string} title
     * @property {string} [subtitle]
     * @property {string} url
     * @property {string} [icon]
     */

    // <!-- @formatter:off -->

    /** @type {Project[]} */
    const projects = [
        {title: "potyk-io", subtitle: 'Эта страница', url: "/toc", icon: '🏠'},
        {title: "potyk-food", subtitle: 'Ворую рецепты', url: "https://potyk.io/potyk-food/", icon: '🍕'},
        {title: "potyk-art", subtitle: 'Рисую чертей по фану', url: "https://www.instagram.com/potyk.art", icon: '🖼️'},
        {title: "potyk-dreams", subtitle: 'Потребление', url: "http://84.201.131.244:5002", icon: '✨'},
        {title: "potyk-ai", subtitle: 'ИИ приколы', url: "https://github.com/potykion/potyk-ai"},
        {title: "potyk-arch", subtitle: 'Software architecture thoughts', url: "https://github.com/potykion/potyk-arch"},
        {title: "potyk-food-guide", subtitle: 'What & where to eat', url: "https://github.com/potykion/potyk-food-guide"},
        {title: "potyk-mu", subtitle: 'Loved music collection', url: "http://84.201.131.244:5004/"},
    ]

    /** @type {Project[]} */
    const codingProjects = [
        {title: "flask-proj-templ", subtitle: "Template for simple flask apps like potyk-dreams", url: "https://github.com/potykion/flask-proj-templ"},
        {title: "lines", subtitle: 'Simply find lines within file without grep brain fvck', url: "https://github.com/potykion/lines"},
        {title: "potyk-assistant", subtitle: 'Telegram bot & api for routine stuff like tracking weight', url: "https://github.com/potykion/potyk-assistant"},
        {title: "sqlite-api", subtitle: '<code>Select * from table as json</code>', url: "https://github.com/potykion/sqlite-api"},
        {title: "src-e", subtitle: "BitBucket (Non-Sucking) Client", url: "http://84.201.131.244:5001/"},
        {title: "potyk-self-2", subtitle: "Дневниковое", url: "http://84.201.131.244:5005"},
        {title: "potyk-stats", subtitle: 'Abandoned daily stats', url: "http://84.201.131.244:5003"},
    ]

    /** @type {Project[]} */
    const tables = [
        {title: 'Музык ', url: 'https://docs.google.com/spreadsheets/d/1Dy9fxDgLzxy84PsIAoyappVB9xfTYHls1rn9KNe4gDs/edit?usp=sharing', icon: '🎵'},
        {title: 'Софт/Сервисы ', url: 'https://docs.google.com/spreadsheets/d/13xf7UHVDKiCf6rbHeHe2rsgwOlWaNRhUYDqAU5M3ULk/edit?usp=sharing', icon: '⚙'},
        {title: 'ЮТ-каналы ', url: 'https://docs.google.com/spreadsheets/d/1BLWN5txwatQdyRSHt0Jl2IWUqIbm-dcAMkEMXIiyTqg/edit?usp=sharing', icon: '📹'},
        {title: "Телеграм Каналы ", url: "https://docs.google.com/spreadsheets/d/1C0RXi9eChoP_AfyLda1jM_aC0aSuLr-fBaJLpaZ34Kw/edit?usp=sharing", icon: '📣'},
        {title: "Театры/Мюзиклы ", url: "https://docs.google.com/spreadsheets/d/1pT59i5SuDrjovAKZXybnOzNWIn1SSljU24STSjIs8tk/edit?usp=sharing", icon: '🎭'},
        {title: 'Пиво Россия ', url: 'https://docs.google.com/spreadsheets/d/1JdhEktmNFFrolieF7O4pkmlic3urTROx8Fq8C2RNWY4/edit?usp=sharing', icon: '🍺'},
        {title: 'Рестики/Кафешки Россия ', url: 'https://docs.google.com/spreadsheets/d/1h56SxxWjZCJmGULhlzVsRvT4KSU4rWoYBEWhQvrecGk/edit?usp=sharing', icon: '🐷'},
        {title: 'Сладости', url: 'https://docs.google.com/spreadsheets/d/1qreMshjaTWnI5GhAEc-CIJafXcK9iwUC16RaG7gYCsM/edit?usp=sharing', icon: '🍪'},

    ]

    // <!-- @formatter:on -->

    /**
     * @param {Project[]} projects
     */
    function makeProjectCards(projects, marked = false) {
        return projects.map(p => {
            let cardClass = `card`;
            if (marked) {
                cardClass = `${cardClass} card-marked`
            }

            let icon = '';
            if (p.icon) {
                icon = `<div>
                        ${p.icon}
                    </div>`
            }

            let subtitle = ''
            if (p.subtitle) {
                console.log(p)
                subtitle = `<small class="card-subtitle">
                            ${p.subtitle}
                        </small>`
            }

            return `
                <a href="${p.url}" class="${cardClass}">
                    ${icon}
                    <div>
                        <div>
                            ${p.title}
                        </div>

                        ${subtitle}
                    </div>
                </a>
            `
        }).join("");
    }

    function makeChipsHtml(projects) {
        return projects.map(
            proj => {
                let title = `${proj.title}`;
                if (proj.icon) {
                    title = `${proj.icon} ${title}`
                }
                if (proj.mark) {
                    title = `<mark>${title}</mark>`
                }

                return `<a class="chip" target="_blank" href="${proj.url}">${title}</a>`;
            }
        ).join(' • ');
    }

    function makeProjectsHtml(projects) {
        return projects.map(
            proj => ` <a class="card" href="${proj.url}">
                <div class="">${proj.title}</div>
                <small class="card-subtitle">${proj.subtitle}</small>
            </a>`
        ).join('');
    }

    document.querySelector('#projects').innerHTML = makeProjectCards(projects);

    document.querySelector('#tables').innerHTML = makeProjectCards(tables);

    document.querySelector('#coding-projects').innerHTML = makeProjectCards(codingProjects);
</script>
</html>
