<div id="summary" class="stats-panel">
    <form class="stats-period" method="get" action="{{ url_for('fin.index') }}">
        <label>
            <span class="label">С</span>
            <input type="date" name="stats_from" value="{{ stats_from.isoformat() }}" required>
        </label>
        <label>
            <span class="label">По</span>
            <input type="date" name="stats_to" value="{{ stats_to.isoformat() }}" required>
        </label>
        <button type="submit" class="secondary">Показать</button>
    </form>

    {% if category_stats %}
    <table class="stats-table">
        <thead>
        <tr>
            <th>Категория</th>
            <th class="num">Сумма</th>
        </tr>
        </thead>
        <tbody>
        {% for row in category_stats %}
        <tr>
            <td>{{ row.category }}</td>
            <td class="num">{{ row.total | rub }}</td>
        </tr>
        {% endfor %}
        </tbody>
        <tfoot>
        <tr>
            <th>Итого</th>
            <td class="num">{{ stats_total | rub }}</td>
        </tr>
        </tfoot>
    </table>
    {% else %}
    <p class="empty">За выбранный период трат нет</p>
    {% endif %}
</div>
