{% macro nav_link(item) -%}
{%- set external = item.url.startswith('http://') or item.url.startswith('https://') -%}
<a class="sidebar-link{% if item.active %} is-active{% endif %}"
   href="{{ item.url }}"
   {% if external %}target="_blank" rel="noopener"{% endif %}>
    <span class="sidebar-link-icon" aria-hidden="true">{{ item.icon }}</span>
    <span class="sidebar-link-title">{{ item.title }}</span>
</a>
{%- endmacro %}

<div class="sidebar-shell" id="sidebar" aria-label="Меню potyk-invest">
    <nav class="sidebar-nav" id="sidebar-nav">
        <section class="sidebar-group">
            <div class="sidebar-group-links">
                {% for item in invest_menu_items %}
                    {{ nav_link(item) }}
                {% endfor %}
            </div>
        </section>
    </nav>
</div>
