{% extends "admin/_base.html" %}

{% block title %}Админка{% endblock %}

{% block admin_main %}
<h1>Админка</h1>
<ul class="admin-sections">
    {% for section in sections %}
    <li>
        <a href="{{ section.url }}">
            <p class="admin-section-title">{{ section.title }}</p>
            {% if section.description %}
            <p class="admin-section-desc">{{ section.description }}</p>
            {% endif %}
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
