<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Вход{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f4ef;
            --ink: #1c1b19;
            --muted: #6b6860;
            --line: #ddd8ce;
            --bad: #9b2c2c;
            --bad-bg: #f8e8e8;
            --pad-x: max(12px, env(safe-area-inset-left));
            --pad-r: max(12px, env(safe-area-inset-right));
        }

        * { box-sizing: border-box; }

        html {
            width: 100%;
            height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            max-width: 720px;
            min-height: 100%;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 0 var(--pad-r) calc(48px + env(safe-area-inset-bottom)) var(--pad-x);
            font-family: "Rubik", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse at top right, #ebe6da 0%, transparent 55%),
                var(--bg);
        }

        body.debug-env::before {
            content: "тестовая среда";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.5rem, 12vw, 6rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--ink);
            opacity: 0.07;
            transform: rotate(-18deg);
            white-space: nowrap;
            user-select: none;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        main {
            width: 100%;
            padding-top: 48px;
        }

        .alert {
            padding: 10px 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .alert-error { background: var(--bad-bg); color: var(--bad); }

        h1 {
            font-weight: 600;
            font-size: 1.35rem;
            margin: 0 0 12px;
        }

        form.grid {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        input, button {
            font: inherit;
            color: var(--ink);
        }

        input {
            width: 100%;
            max-width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            font-size: 16px;
        }

        button {
            padding: 10px 14px;
            border: 1px solid var(--ink);
            border-radius: 6px;
            background: var(--ink);
            color: #fff;
            cursor: pointer;
            font-weight: 500;
            min-height: 44px;
            touch-action: manipulation;
        }
    </style>
</head>
<body{% if config.DEBUG %} class="debug-env"{% endif %}>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

{% block main %}{% endblock %}
</main>
</body>
</html>
